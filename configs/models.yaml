# Model registry. Loaded by societysim.models.registry. Check changes with `societysim doctor`.
#
# providers: throttle per LiteLLM provider prefix (concurrency = calls in flight, rpm = per minute).
#   gemini is set for the AI Studio free tier (about 10-15 RPM); raise it with a paid key.
# models: one ModelSpec each (see societysim.config.ModelSpec).
#   structured: json_schema | json_object | none. `doctor` reports which one actually works.
#   Prices are USD per 1M tokens, only where LiteLLM's table is likely missing the model.
#   HF model ids and provider pins are best guesses until `doctor` has run with a real HF_TOKEN.

providers:
  gemini: {concurrency: 2, rpm: 10}
  huggingface: {concurrency: 8, rpm: 120}
  openai: {concurrency: 8, rpm: 300}

models:
  # --- Hugging Face Inference Providers ---
  - name: qwen3-235b
    litellm_model: huggingface/Qwen/Qwen3-235B-A22B-Instruct-2507
    hf_provider: together
    structured: json_object
    temperature: 0.7
    max_tokens: 1024
    input_cost_per_mtok: 0.2
    output_cost_per_mtok: 0.6
    color: "#4f8ef7"
  - name: llama4-maverick
    litellm_model: huggingface/meta-llama/Llama-4-Maverick-17B-128E-Instruct
    hf_provider: together
    structured: json_object
    max_tokens: 1024
    input_cost_per_mtok: 0.27
    output_cost_per_mtok: 0.85
    color: "#9b6bf2"
  - name: gemma4-26b
    litellm_model: huggingface/google/gemma-4-26b-it
    structured: none
    max_tokens: 1024
    input_cost_per_mtok: 0.1
    output_cost_per_mtok: 0.3
    color: "#34a853"
  - name: gpt-oss-120b
    litellm_model: huggingface/openai/gpt-oss-120b
    hf_provider: cerebras
    structured: json_object
    reasoning_effort: low
    max_tokens: 2048
    input_cost_per_mtok: 0.25
    output_cost_per_mtok: 0.69
    color: "#e8833a"
  - name: deepseek-v3.1
    litellm_model: huggingface/deepseek-ai/DeepSeek-V3.1
    hf_provider: together
    structured: json_object
    max_tokens: 1024
    input_cost_per_mtok: 0.6
    output_cost_per_mtok: 1.7
    color: "#2bb3b1"

  # --- Google AI Studio ---
  - name: gemini-flash-lite
    litellm_model: gemini/gemini-2.5-flash-lite
    structured: json_schema
    reasoning_effort: disable # thinking budget 0
    max_tokens: 1024
    color: "#fbbc04"
  - name: gemini-flash
    litellm_model: gemini/gemini-2.5-flash
    structured: json_schema
    reasoning_effort: disable
    max_tokens: 1024
    color: "#f29900"

  # --- OpenAI (selected runs only) ---
  - name: gpt-5-nano
    litellm_model: openai/gpt-5-nano
    structured: json_schema
    temperature: 1.0 # reasoning models only accept the default
    reasoning_effort: minimal
    max_tokens: 2048
    color: "#10a37f"
  - name: gpt-5-mini
    litellm_model: openai/gpt-5-mini
    structured: json_schema
    temperature: 1.0
    reasoning_effort: minimal
    max_tokens: 2048
    color: "#0d7f61"
