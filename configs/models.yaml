# Model registry. Loaded by societysim.models.registry. Check changes with `societysim doctor`.
#
# providers: throttle per LiteLLM provider prefix (concurrency = calls in flight, rpm = per minute).
#   gemini is set for the AI Studio free tier (about 10-15 RPM); raise it with a paid key.
#   hosted_vllm/ models served from the HF router (HOSTED_VLLM_API_BASE below) count against the
#   huggingface limit, because both routes hit router.huggingface.co (client.limit_key). The
#   hosted_vllm entry below only applies to a hosted_vllm model on some other endpoint.
#   A model with its own api_base (the AMD servers) gets its own limit per endpoint, keyed
#   `<provider>@<host[:port]>`, so slow self-hosted turns never hold OpenAI's slots, rpm or
#   timeout (#423). It uses the default (8 in flight, 300 rpm, 120 s) unless listed here.
# models: one ModelSpec each (see societysim.config.ModelSpec).
#   avatar_presentation: feminine | masculine | neutral, how viewer/public/avatars/<name>.webp
#   reads. It picks the seat's name pool so names match the portraits (#400). Default neutral.
#   structured: json_schema | json_object | none. `doctor` reports which one actually works.
#   Prices are USD per 1M tokens, only where LiteLLM's table is likely missing the model.
#   HF ids, provider pins and prices come from router.huggingface.co/v1/models (live providers
#   that support structured output). Gemini ids from ai.google.dev/gemini-api/docs/models.
#   temperature: sent for every model except Gemini 3+ (`gemini/gemini-3*`, see
#   client.sends_temperature). Google is removing temperature, top_p and top_k for those, so we
#   don't send them and the model uses its default sampling. The `temperature` value on those
#   entries is ignored (it still goes into the cache key).
#   `doctor` probes every structured mode, not just the configured one. A mode that fails
#   prints LiteLLM's "If you need to debug this error" line. That is expected, not a retry.

providers:
  gemini: {concurrency: 2, rpm: 10}
  huggingface: {concurrency: 8, rpm: 120, timeout_s: 180} # qwen3-235b timed out at the 120 s default (#346)
  openai: {concurrency: 8, rpm: 300}
  hosted_vllm: {concurrency: 8, rpm: 120} # hosted_vllm on a non-HF-router endpoint

# DeepInfra rejects LiteLLM's huggingface/deepinfra/... route, so those models go through the
# HF unified endpoint as `hosted_vllm/<hf_id>:deepinfra`; LiteLLM reads these variables.
# AMD uses a per-model base URL and key so OpenAI's hosted models keep their default endpoint.
env:
  HOSTED_VLLM_API_BASE: https://router.huggingface.co/v1
  AMD_LLAMACPP_BASE_URL: http://127.0.0.1:8000/v1 # llama-server on the pod (infra/amd/serve.sh)
env_from:
  HOSTED_VLLM_API_KEY: HF_TOKEN

models:
  # --- Hugging Face Inference Providers ---
  - name: qwen3-235b
    avatar_presentation: masculine
    litellm_model: hosted_vllm/Qwen/Qwen3-235B-A22B-Instruct-2507:deepinfra
    structured: json_object
    temperature: 0.7
    max_tokens: 2048 # 1024 cut JSON off mid-string (#346)
    input_cost_per_mtok: 0.09
    output_cost_per_mtok: 0.55
    color: "#4f8ef7"
  - name: llama4-maverick
    avatar_presentation: masculine
    litellm_model: huggingface/meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8
    hf_provider: novita
    structured: json_object
    max_tokens: 1024
    input_cost_per_mtok: 0.27
    output_cost_per_mtok: 0.85
    color: "#9b6bf2"
  - name: gemma4-26b
    avatar_presentation: feminine
    litellm_model: hosted_vllm/google/gemma-4-26B-A4B-it:deepinfra
    structured: json_schema
    max_tokens: 1024
    input_cost_per_mtok: 0.07
    output_cost_per_mtok: 0.34
    color: "#34a853"
  - name: gpt-oss-120b
    avatar_presentation: masculine
    litellm_model: huggingface/openai/gpt-oss-120b
    hf_provider: cerebras
    structured: json_object
    reasoning_effort: low
    max_tokens: 2048
    input_cost_per_mtok: 0.35
    output_cost_per_mtok: 0.75
    color: "#e8833a"
  - name: deepseek-v3.1
    avatar_presentation: masculine
    litellm_model: hosted_vllm/deepseek-ai/DeepSeek-V3.1:deepinfra
    structured: json_object
    max_tokens: 1024
    input_cost_per_mtok: 0.25
    output_cost_per_mtok: 0.95
    color: "#2bb3b1"

  # --- Google AI Studio ---
  - name: gemini-flash-lite
    avatar_presentation: feminine
    litellm_model: gemini/gemini-3.5-flash-lite
    structured: json_schema
    reasoning_effort: disable # thinking budget 0
    max_tokens: 1024
    color: "#fbbc04"
  - name: gemini-flash
    avatar_presentation: feminine
    litellm_model: gemini/gemini-3.8-flash
    structured: json_schema
    reasoning_effort: disable
    max_tokens: 1024
    color: "#f29900"

  # --- Self-hosted on AMD Radeon AI PRO R9700 (T6.3, infra/amd/serve.sh) ---
  # LiteLLM's `openai/` route strips that first prefix and sends the rest as the model id, so
  # the rest must equal the server's served name. serve.sh serves under the HF id
  # (--served-model-name $AMD_MODEL = openai/gpt-oss-20b), hence the doubled prefix. doctor and
  # play check GET {api_base}/models lists that id before any game call.
  # Cost is 0: the AMD quota is minutes, not dollars. $/game = hours x AMD_PRICE_PER_HOUR.
  # Low reasoning effort (#151): at default effort a turn spent most of its time reasoning at
  # ~33 tok/s single stream. max_tokens caps a runaway turn at about a minute.
  - name: amd-gpt-oss-20b
    avatar_presentation: masculine
    litellm_model: openai/openai/gpt-oss-20b
    api_base: ${AMD_VLLM_BASE_URL} # https://<name>.trycloudflare.com/v1
    api_key_env: AMD_API_KEY
    structured: json_schema # vLLM guided decoding (xgrammar, else outlines)
    reasoning_effort: low # LiteLLM's openai/ route passes it through; vLLM applies it to gpt-oss
    max_tokens: 2048
    input_cost_per_mtok: 0
    output_cost_per_mtok: 0
    color: "#ed1c24"

  # AMD Strix Halo (Radeon 8060S, 64 GB unified memory) via llama.cpp llama-server, $0/h.
  # serve.sh --backend llamacpp serves the GGUF under the id openai/gpt-oss-20b (--alias), so the
  # prefix is doubled like the vLLM entry. llama-server takes response_format json_schema
  # (grammar-constrained). Reasoning effort is also set server-side via --chat-template-kwargs.
  - name: amd-strix-gpt-oss-20b
    avatar_presentation: masculine
    litellm_model: openai/openai/gpt-oss-20b
    api_base: ${AMD_LLAMACPP_BASE_URL}
    api_key_env: AMD_API_KEY
    structured: json_schema
    reasoning_effort: low
    max_tokens: 2048
    input_cost_per_mtok: 0
    output_cost_per_mtok: 0
    color: "#ed1c24"

  # --- OpenAI (selected runs only) ---
  - name: gpt-5-nano
    avatar_presentation: neutral
    litellm_model: openai/gpt-5-nano
    structured: json_schema
    temperature: 1.0 # reasoning models only accept the default
    reasoning_effort: minimal
    max_tokens: 2048
    color: "#10a37f"
  - name: gpt-5-mini
    avatar_presentation: neutral
    litellm_model: openai/gpt-5-mini
    structured: json_schema
    temperature: 1.0
    reasoning_effort: minimal
    max_tokens: 2048
    color: "#0d7f61"
