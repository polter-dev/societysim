# Real runs need --agents llm (the default is scripted): societysim batch --config <this file> --agents llm
# Main experiment: ~100 mixed games, seats rotated through all models, roles balanced by
# batch/assign.py. GPT models sit in at most 10 games each.
batch_id: mixed_v1
seed: 3
n_games: 100
mode: mixed
# Sized from T5.1: about $0.023 per game for cheap HF models. The dry-run prior is about 4x high,
# so expected real cost is about $5 for 100 games; the cap is about 2x expected.
# amd-gpt-oss-20b is left out because the AMD server is not reachable.
budget_usd: 10.0
max_concurrency: 8
models:
  - gemma4-26b
  - qwen3-235b
  - llama4-maverick
  - gpt-oss-120b
  - deepseek-v3.1
  - gemini-flash-lite
  - gemini-flash
  - gpt-5-nano
  - gpt-5-mini
model_game_limits:
  gpt-5-nano: 10
  gpt-5-mini: 10
game:
  n_players: 7
