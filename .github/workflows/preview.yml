name: Preview

# Cloudflare Pages preview for every PR that touches viewer/, so reviewers can click through
# the UI before merge. Builds the same site as deploy.yml (viewer plus the sample game) and
# deploys it to the societysim Pages project on a branch named after the PR. The URL goes in a
# PR comment that is updated on each push.
#
# Needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable (the same ones
# deploy.yml uses). Without them, or on a PR from a fork, the job skips with a notice.
# Not a required check: keep it out of the repo ruleset.
#
# Security: this runs on `pull_request`, never `pull_request_target`, so fork PRs get no
# secrets. The job also refuses to run for a fork on its own.

on:
  pull_request:
    paths:
      - "viewer/**"
      - "scripts/deploy-space.sh"
      - ".github/workflows/preview.yml"

permissions:
  contents: read
  pull-requests: write # only for the preview comment

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork PRs have no secrets and should not get a write token; skip them outright.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # No secrets at job level: the build steps run PR code. Each secret is set on the one
    # step that needs it.
    env:
      VITE_NEON_DATA_API_URL: ${{ vars.VITE_NEON_DATA_API_URL }}
      VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          # Booleans only; the values never reach this step.
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAVE_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAVE_TOKEN" != true ] || [ "$HAVE_ACCOUNT" != true ]; then
            echo "::notice::Skipping the preview: set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false # keep GITHUB_TOKEN out of .git/config
      - if: steps.creds.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build the site
        if: steps.creds.outputs.ready == 'true'
        run: |
          uv sync --frozen
          batch="$RUNNER_TEMP/sample-batch"
          mkdir -p "$batch"
          cp fixtures/sample_game.jsonl fixtures/sample_game.labels.jsonl "$batch/"
          uv run societysim report "$batch"
          bash scripts/deploy-space.sh --out "$RUNNER_TEMP/site" "$batch"
          rm -f "$RUNNER_TEMP/site/README.md"
          test -s "$RUNNER_TEMP/site/index.json" || { echo "::error::staged site has no index.json"; exit 1; }
      - name: Deploy the preview
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Pages branch aliases are lowercase letters, digits and dashes.
          branch=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | cut -c1-28)
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/site" --project-name societysim \
            --branch "$branch" --commit-dirty=true | tee "$RUNNER_TEMP/wrangler.log"
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/wrangler.log" | tail -n1)
          test -n "$url" || { echo "::error::wrangler printed no pages.dev URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the URL on the PR
        if: steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL:${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- societysim-preview -->'
          body="$marker"$'\n'"**Viewer preview:** $URL"$'\n\n'"Built from ${SHA:0:7} with the sample game. Updated on every push."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
