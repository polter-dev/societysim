name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  # Windows catches cp1252 and path bugs. Not set as required in the repo ruleset
  # (required checks are python, review-gate, viewer); promote it once it's been
  # green on main for a few days. Do not set PYTHONUTF8 / PYTHONIOENCODING here:
  # we want the real Windows default encoding.
  python-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # System32\bash.exe is the WSL launcher; tests that spawn `bash` need Git Bash.
      - name: Put Git Bash first on PATH
        run: echo 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"
      - name: Check which bash tests will use
        run: |
          which -a bash
          bash --version
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run pytest

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: |
          if [ -f viewer/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.exists.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - if: steps.exists.outputs.present == 'true'
        working-directory: viewer
        run: |
          npm ci
          npx tsc --noEmit
          npm test --if-present
          npm run build
      - if: steps.exists.outputs.present != 'true'
        run: echo "No viewer yet; skipping."
