# Render blueprint for the visitor-play server (#340): fallback host while Hugging Face
# reviews the Space. Dashboard: New > Blueprint > pick this repo. Secret values are pasted
# in the dashboard (sync: false); none live in this file.
services:
  - type: web
    name: societysim-play
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter
    numInstances: 1 # game state is in memory: never scale out or autoscale
    healthCheckPath: /api/health
    envVars:
      - key: PLAY_OPENAI_API_KEY
        sync: false
      - key: PLAY_HF_TOKEN
        sync: false
      - key: PLAY_GEMINI_API_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: PLAY_ALERT_WEBHOOK_URL
        sync: false
      # Render's private hop (10.x) plus Cloudflare's edge ranges, which sit in front of every
      # Render web service. X-Forwarded-For arrives as "<client-sent>, <real client>,
      # <Cloudflare edge>, <Render 10.x>", so the server walks it right to left past these and
      # lands on the real client. See README, "Deploy on Render".
      - key: PLAY_TRUSTED_PROXIES
        value: "10.0.0.0/8,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - key: PLAY_ALLOWED_MODELS
        value: "qwen3-235b,llama4-maverick,gemma4-26b,gpt-oss-120b,deepseek-v3.1,gemini-flash-lite,gpt-5-nano"
      - key: PLAY_RATE_PER_MIN
        value: "120"
      - key: PLAY_MAX_ACTIVE_PER_IP
        value: "1"
      - key: PLAY_MAX_GAMES_PER_IP_DAY
        value: "5"
      - key: PLAY_MAX_CONCURRENT
        value: "4"
      - key: PLAY_MAX_GAME_MINUTES
        value: "45"
      - key: PLAY_DAILY_BUDGET_USD
        value: "2.0"
      - key: PLAY_MAX_TOKENS
        value: "2048"
