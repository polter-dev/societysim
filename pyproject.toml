[project]
name = "societysim"
version = "0.1.0"
description = "Multi-model LLM Werewolf: engine, metrics and replay viewer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "httpx>=0.28",
    "huggingface-hub>=1.33.0",
    "jsonschema>=4.26",
    "litellm>=1.50",
    "matplotlib>=3.11.2",
    "openskill>=6.2.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
societysim = "societysim.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/societysim"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls paid APIs; skipped unless SOCIETYSIM_LIVE=1"]
