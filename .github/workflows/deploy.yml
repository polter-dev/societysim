name: Deploy

# Stages the viewer plus one batch of games and publishes it. Runs by hand, and on every
# push to main that touches viewer/ (default targets, default data source).
#   gh workflow run deploy.yml -f targets=cloudflare
#   gh workflow run deploy.yml -f source=hf:societysim/societysim-games:my-batch
# Data source, first match wins: the batch input (a committed dir), the source input, the
# DEPLOY_SOURCE repo variable, then the sample game. A source of hf:<owner/name>[:<batch_id>]
# downloads that HF Dataset (written by `societysim publish`), labels it with --no-jev if it
# has no labels, and runs report and highlights. No paid calls. A private dataset needs HF_TOKEN.
# Targets (comma separated): cloudflare, hf-space, github-pages. Default is all three.
# runs/ is gitignored, so CI gets real batches from the HF Dataset instead.
# Cloudflare needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable;
# without them that step is skipped. hf-space needs the HF_TOKEN secret.
# Visitor play: the viewer build gets the VITE_PLAY_API_URL and VITE_TURNSTILE_SITE_KEY repo
# variables (both public). The deploy-play job (dispatch with deploy_play=true) pushes the game
# server to the polter-dev/societysim-play Space; see README, "Visitor play".
# Live Neon games: set the VITE_NEON_DATA_API_URL and VITE_NEON_AUTH_URL repo variables (README,
# deploy section). Unset, the viewer builds in static mode and the log says so.

on:
  push:
    branches: [main]
    paths: ["viewer/**"]
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma separated: cloudflare, hf-space, github-pages"
        default: "cloudflare,hf-space,github-pages"
      batch:
        description: "Committed batch dir with report/index.json; leave empty for the sample game"
        required: false
      source:
        description: "Data source hf:<owner/name>[:<batch_id>]; defaults to the DEPLOY_SOURCE repo variable, then the sample game"
        required: false
      space:
        description: "HF Space id (owner/name); defaults to the HF_SPACE repo variable"
        required: false
      deploy_play:
        description: "Deploy only the visitor-play server Space (deploy-play job); skips the site deploy"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # lets us start pages.yml

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || !inputs.deploy_play
    runs-on: ubuntu-latest
    env:
      BATCH: ${{ inputs.batch }}
      SOURCE: ${{ inputs.source || vars.DEPLOY_SOURCE }}
      TARGETS: ${{ inputs.targets || 'cloudflare,hf-space,github-pages' }}
      SPACE: ${{ inputs.space || vars.HF_SPACE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      # Public, read-only: the Data API URL and the Neon Auth URL (the page fetches a short-lived
      # anonymous JWT from <auth>/token/anonymous; select-only grants, neon/schema.sql). Repo
      # variables, not secrets. Never NEON_DATABASE_URL here. VITE_NEON_ANON_KEY is optional and
      # not recommended: a pinned JWT expires (about 1 h).
      VITE_NEON_DATA_API_URL: ${{ vars.VITE_NEON_DATA_API_URL }}
      VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}
      VITE_NEON_ANON_KEY: ${{ vars.VITE_NEON_ANON_KEY }}
      # Visitor play (both public by design). Unset, the viewer hides the play entry.
      VITE_PLAY_API_URL: ${{ vars.VITE_PLAY_API_URL }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Pick the batch
        run: |
          if [ -n "$BATCH" ] && [ ! -f "$BATCH/report/index.json" ]; then
            echo "::error::$BATCH/report/index.json not found (runs/ is not in the repo; deploy real batches locally)"
            exit 1
          fi
          if [ -z "$BATCH" ] && [ -n "$SOURCE" ]; then
            case "$SOURCE" in
              hf:*) ;;
              *) echo "::error::source must look like hf:<owner/name>[:<batch_id>]"; exit 1 ;;
            esac
            # A bad source must not block viewer deploys: warn and use the sample game.
            if BATCH=$(uv run python scripts/fetch_hf_batch.py "$SOURCE" --root "$RUNNER_TEMP/runs"); then
              # Free labels only (--no-jev), for each game that has no labels file.
              mkdir -p "$RUNNER_TEMP/unlabeled"
              for log in "$BATCH"/*.jsonl; do
                case "$log" in *.labels.jsonl) continue ;; esac
                [ -f "${log%.jsonl}.labels.jsonl" ] || cp "$log" "$RUNNER_TEMP/unlabeled/"
              done
              if ls "$RUNNER_TEMP"/unlabeled/*.jsonl >/dev/null 2>&1; then
                uv run societysim label "$RUNNER_TEMP/unlabeled" --no-jev
                cp "$RUNNER_TEMP"/unlabeled/*.labels.jsonl "$BATCH/"
              fi
              uv run societysim report "$BATCH"
              uv run societysim highlights "$BATCH"
            else
              echo "::warning::could not fetch $SOURCE; deploying the sample game instead"
              BATCH=""
            fi
          fi
          if [ -z "$BATCH" ]; then
            BATCH="$RUNNER_TEMP/sample-batch"
            mkdir -p "$BATCH"
            cp fixtures/sample_game.jsonl fixtures/sample_game.labels.jsonl "$BATCH/"
            uv run societysim report "$BATCH"
          fi
          echo "BATCH=$BATCH" >> "$GITHUB_ENV"

      - name: Cloudflare Pages
        if: contains(format(',{0},', env.TARGETS), ',cloudflare,')
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipping Cloudflare: set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable."
            exit 0
          fi
          bash scripts/deploy-space.sh --out "$RUNNER_TEMP/site" "$BATCH"
          # Pages has no use for the HF Space front matter.
          rm -f "$RUNNER_TEMP/site/README.md"
          for f in index.json leaderboard.json metrics.json _headers 404.html; do
            test -s "$RUNNER_TEMP/site/$f" || { echo "::error::staged site has no $f at its root"; exit 1; }
          done
          npx --yes wrangler@4 pages project create societysim --production-branch main ||
            echo "project create failed or it already exists; continuing"
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/site" --project-name societysim --branch main --commit-dirty=true
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/societysim/domains"
          for domain in society-sim.us www.society-sim.us; do
            code=$(curl -sS -o "$RUNNER_TEMP/domain.json" -w '%{http_code}' -X POST "$api" \
              -H @<(printf 'Authorization: Bearer %s' "$CLOUDFLARE_API_TOKEN") \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$domain\"}")
            if [ "$code" = 200 ] || [ "$code" = 409 ] || grep -qi 'already' "$RUNNER_TEMP/domain.json"; then
              echo "domain $domain: attached"
            else
              echo "::error::attaching $domain failed (HTTP $code)"
              python3 -c 'import json,sys; print([e.get("message") for e in json.load(open(sys.argv[1])).get("errors",[])])' "$RUNNER_TEMP/domain.json" || true
              exit 1
            fi
          done
          echo "deployed: https://society-sim.us"

      - name: Hugging Face Space
        if: contains(format(',{0},', env.TARGETS), ',hf-space,')
        run: |
          test -n "$HF_TOKEN" || { echo "::error::HF_TOKEN secret is not set"; exit 1; }
          test -n "$SPACE" || { echo "::error::set the space input or the HF_SPACE variable"; exit 1; }
          # The script also starts the GitHub Pages mirror after the upload.
          bash scripts/deploy-space.sh "$BATCH" "$SPACE"

      - name: GitHub Pages mirror
        if: contains(format(',{0},', env.TARGETS), ',github-pages,') && !contains(format(',{0},', env.TARGETS), ',hf-space,')
        run: |
          test -n "$SPACE" || { echo "::error::set the space input or the HF_SPACE variable"; exit 1; }
          gh workflow run pages.yml -f space="$SPACE"

  deploy-play:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_play
    runs-on: ubuntu-latest
    env:
      # HF_TOKEN deploys the Space. The PLAY_* keys are dedicated, limited keys for visitors;
      # the script sets them on the Space as OPENAI_API_KEY, HF_TOKEN and GEMINI_API_KEY.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PLAY_OPENAI_API_KEY: ${{ secrets.PLAY_OPENAI_API_KEY }}
      PLAY_HF_TOKEN: ${{ secrets.PLAY_HF_TOKEN }}
      PLAY_GEMINI_API_KEY: ${{ secrets.PLAY_GEMINI_API_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      PLAY_DAILY_BUDGET_USD: ${{ vars.PLAY_DAILY_BUDGET_USD }}
      PLAY_ENABLED: ${{ vars.PLAY_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Deploy the play Space
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$NEON_DATABASE_URL" ] || [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "::notice::Skipping deploy-play: set the HF_TOKEN, NEON_DATABASE_URL and TURNSTILE_SECRET_KEY secrets (and PLAY_OPENAI_API_KEY, PLAY_HF_TOKEN, PLAY_GEMINI_API_KEY for the models)."
            exit 0
          fi
          bash scripts/deploy-play-space.sh
