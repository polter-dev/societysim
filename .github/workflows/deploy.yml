name: Deploy

# Stages the viewer plus one batch of games and publishes it. Manual only.
#   gh workflow run deploy.yml -f targets=cloudflare
# Targets (comma separated): cloudflare, hf-space, github-pages. Default is all three.
# CI deploys the sample game in fixtures/ (run through `societysim report`). runs/ is
# gitignored, so real batches are deployed locally; see the README.
# Cloudflare needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable;
# without them that step is skipped. hf-space needs the HF_TOKEN secret.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma separated: cloudflare, hf-space, github-pages"
        default: "cloudflare,hf-space,github-pages"
      batch:
        description: "Committed batch dir with report/index.json; leave empty for the sample game"
        required: false
      space:
        description: "HF Space id (owner/name); defaults to the HF_SPACE repo variable"
        required: false

permissions:
  contents: read
  actions: write # lets us start pages.yml

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BATCH: ${{ inputs.batch }}
      SPACE: ${{ inputs.space || vars.HF_SPACE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Pick the batch
        run: |
          if [ -n "$BATCH" ] && [ ! -f "$BATCH/report/index.json" ]; then
            echo "::error::$BATCH/report/index.json not found (runs/ is not in the repo; deploy real batches locally)"
            exit 1
          fi
          if [ -z "$BATCH" ]; then
            BATCH="$RUNNER_TEMP/sample-batch"
            mkdir -p "$BATCH"
            cp fixtures/sample_game.jsonl fixtures/sample_game.labels.jsonl "$BATCH/"
            uv run societysim report "$BATCH"
          fi
          echo "BATCH=$BATCH" >> "$GITHUB_ENV"

      - name: Cloudflare Pages
        if: contains(format(',{0},', inputs.targets), ',cloudflare,')
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipping Cloudflare: set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable."
            exit 0
          fi
          bash scripts/deploy-space.sh --out "$RUNNER_TEMP/site" "$BATCH"
          # Pages has no use for the HF Space front matter.
          rm -f "$RUNNER_TEMP/site/README.md"
          npx --yes wrangler@4 pages project create societysim --production-branch main ||
            echo "project create failed or it already exists; continuing"
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/site" --project-name societysim --branch main --commit-dirty=true
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/societysim/domains"
          for domain in society-sim.us www.society-sim.us; do
            code=$(curl -sS -o "$RUNNER_TEMP/domain.json" -w '%{http_code}' -X POST "$api" \
              -H @<(printf 'Authorization: Bearer %s' "$CLOUDFLARE_API_TOKEN") \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$domain\"}")
            if [ "$code" = 200 ] || [ "$code" = 409 ] || grep -qi 'already' "$RUNNER_TEMP/domain.json"; then
              echo "domain $domain: attached"
            else
              echo "::error::attaching $domain failed (HTTP $code)"
              python3 -c 'import json,sys; print([e.get("message") for e in json.load(open(sys.argv[1])).get("errors",[])])' "$RUNNER_TEMP/domain.json" || true
              exit 1
            fi
          done
          echo "deployed: https://society-sim.us"

      - name: Hugging Face Space
        if: contains(format(',{0},', inputs.targets), ',hf-space,')
        run: |
          test -n "$HF_TOKEN" || { echo "::error::HF_TOKEN secret is not set"; exit 1; }
          test -n "$SPACE" || { echo "::error::set the space input or the HF_SPACE variable"; exit 1; }
          # The script also starts the GitHub Pages mirror after the upload.
          bash scripts/deploy-space.sh "$BATCH" "$SPACE"

      - name: GitHub Pages mirror
        if: contains(format(',{0},', inputs.targets), ',github-pages,') && !contains(format(',{0},', inputs.targets), ',hf-space,')
        run: |
          test -n "$SPACE" || { echo "::error::set the space input or the HF_SPACE variable"; exit 1; }
          gh workflow run pages.yml -f space="$SPACE"
