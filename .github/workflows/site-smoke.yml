name: Site smoke

# Manual only: loads the live site in headless Chromium and checks every page (scripts/site_smoke.py).
# Read-only, no secrets.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to check"
        required: false
        default: "https://society-sim.us"
      strict_play:
        description: "Fail unless the play start screen is up (not coming soon / offline)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra smoke
      - run: uv run playwright install --with-deps chromium
      - name: Check the site
        env:
          BASE_URL: ${{ inputs.base_url }}
          STRICT: ${{ inputs.strict_play && '--strict-play' || '' }}
        run: uv run python scripts/site_smoke.py "$BASE_URL" $STRICT
